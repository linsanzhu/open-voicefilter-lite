# Apple-Silicon training configuration for VoiceFilter-Lite.
#
# Same architecture and loss as `configs/paper.yaml` (paper-faithful for
# the §4.4 2.2 MB production variant — 3 LSTM × 256, asym L2 α=10, hinge
# + adaptive w^(t)) but with the optimisation budget scaled down for MPS:
# ~3-7 days of real time on a single M-series chip (vs 1-3 days on a CUDA
# box running `configs/paper.yaml`).
#
# Loaded via:
#     python scripts/train.py --config configs/mps.yaml
#
# Any field here overrides the matching default in `HParams`.
# CLI flags (e.g. --total-steps 50 for a smoke run) still take precedence
# over this file.

# ---- Architecture (paper §4.2 / §4.4: 2.2 MB production variant) ----
# Paper main experiments: 3 LSTM × 512 (6.8 MB). Production ship-target:
# "By reducing each LSTM layer to only 256 nodes, the model size becomes
# 2.2 MB ... but still with similar WER performance." — §4.4 last row.
hidden_dim: 256
num_lstm_layers: 3

# ---- Streaming / frame stacking (paper §4.5) ----
# "the 512-dim stacked-by-4 log Mel-filterbank energies" — model I/O uses
# 80*4 = 320-dim stacked filterbanks instead of the legacy 80*3 = 240.
frame_stack: 4

# ---- Data / mixture ----
sample_length_sec: 3.0 # paper Fig 2: "segment of 3 seconds during training"
snr_min_db: -1.0 # paper §3.2: "random within -1dB to 10dB"
snr_max_db: 10.0
silent_target_prob: 0.10 # train the "do nothing" mode
silent_interference_prob: 0.10
target_config: clean
target_splits:
  - train.360 # tuple[str, ...] — 多 split 一起列
interference_config: other
interference_split: train.500

# streaming=True here because we want fast first-time startup on MPS
# without pre-downloading the ~60 GB LibriSpeech arrow cache. Once you've
# run `python scripts/download_data.py --assets librispeech` and have the
# cache locally, flip this to false — `streaming=False` is much faster
# per batch (no network fetch) and recommended for any non-smoke run.
streaming: false

# ---- Augmentation (paper §3.2 — speech + non-speech, additive or reverb) ----
# Paper's non-speech source is "ambient noises recorded in cafes, cars, and
# quiet environments, as well as music" — Musan (music/noise) is the
# closest open substitute. Paper's RIRs are "3 million convolutional room
# impulse responses generated by a room simulator"; real-room RIRs (e.g.
# openslr-rirs) approximate this. Both default to OFF in HParams so a
# fresh checkout can train without extra data; this file keeps them OFF
# because the configured HF sources are flaky. Enable by:
#   1) pointing musan_source / rir_source at working mirrors in HParams
#      (e.g. corypaik/musan, schism-audio/openslr-rirs)
#   2) running `python scripts/download_data.py --assets musan rir`
#   3) flipping the flags below to true.
# `babble` has no HF config — `dataset.py` synthesises it from the `speech`
# subset by overlaying `musan_babble_n_speakers` clips with random gains.
# If a dataset is enabled but fails to load, training degrades gracefully:
#   - Musan unavailable → interference falls back to all-LibriSpeech
#   - real RIR unavailable → procedural exponential-decay RIRs (always works)
use_musan: true
musan_prob: 0.7 # P(interference = Musan noise vs LibriSpeech speaker)
musan_subset: babble,music,noise
musan_babble: true
musan_babble_n_speakers: 3
use_real_rir: true
rir_prob: 0.4 # P(target is convolved with a random RIR)
# Primary `confit/rir-noise` is a loader that pulls SLR28 from openslr.org;
# fallback `quinnlue/rirs` is a HF-resident mirror with the same
# `simulated_rirs` layout. `dataset._ensure_rir_open` tries
# (source × config), then falls back to procedural RIRs as a last resort.
rir_source: confit/rir-noise
rir_source_fallbacks:
  - quinnlue/rirs

# ---- Optimisation ----
batch_size: 16 # paper doesn't specify; 32 is CUDA-friendly
total_steps: 100000 # MPS-friendly reduced budget (paper uses 200 000)
learning_rate: 1.0e-3 # linear-scaling from paper's 2e-3 @ batch=32 → 1e-3 @ batch=16
warmup_steps: 2000
weight_decay: 1.0e-5 # small L2 regularisation

# ---- Regularisation ----
dropout: 0.10 # LSTM input/output dropout
use_ema: true
ema_decay: 0.999
ema_warmup_steps: 100

# ---- Loss (paper §3.3 — asymmetric L2, α = 10) ----
# g_asym(x, α) = α·x if x > 0 else x; loss = mean(g_asym(target - pred, α)²)
# Over-suppression errors (S_enh < S_cln) are amplified by α² = 100.
loss_alpha: 10.0

# ---- Noise-type predictor (paper §4.2 / §3.4) ----
# Trained with hinge loss for per-frame binary classification
# ("is this frame overlapped speech?"). At inference, its sigmoid drives
# the adaptive suppression `w^(t)` per §3.4 — this is what gives the paper
# its "always harmless and sometimes helpful" production behaviour.
use_noise_type_predictor: true
hinge_loss_weight:
  0.1 # paper doesn't specify; 0.1 keeps hinge in the same
  # magnitude band as L_asym so neither term is starved.
adaptive_w_beta: 0.8 # paper §4.4 "moving average coefficient β = 0.8"
adaptive_w_a: 1.0 # paper §3.4 linear transform "a > 0"
adaptive_w_b: 0.0 # paper §3.4 linear transform "b ≥ 0"

# ---- Misc ----
seed: 1234
device: mps # use "mps" on Apple Silicon

# ---- HF Hub endpoint (network mirror) ----
# Default behaviour: every HF pull (`openslr/librispeech_asr`,
# `corypaik/musan`, `quinnlue/rirs`, `speechbrain/spkrec-ecapa-voxceleb`)
# goes to `https://huggingface.co`. That host is unreachable from some
# networks (e.g. mainland China without a VPN) — set `hf_endpoint` to a
# mirror so all HF traffic is redirected. Precedence is
# `--hf-endpoint` (CLI) > `HF_ENDPOINT` env > this field > default.
# Equivalent env: `HF_ENDPOINT=https://hf-mirror.com python ...`
# Uncomment the line below to make this config self-contained:
# hf_endpoint: https://hf-mirror.com

# ---- HF hf_transfer protocol toggle ----
# `huggingface_hub` has a faster download protocol (`hf_transfer`) that's
# opt-in via `HF_HUB_ENABLE_HF_TRANSFER`. Most mirrors (e.g.
# hf-mirror.com) DON'T implement it and will silently 502. Leaving this
# field `None` (default) means `apply_hf_endpoint` only flips it off
# automatically when a mirror endpoint is selected. Force-on/off via
# `--hf-transfer` / `--no-hf-transfer`, or here:
# hf_transfer: false   # safe everywhere; uncomment to force HTTPS-only

# ---- Data-loading parallelism (kills the "GPU-idle-between-batches" stall) ----
# Single-threaded audio decode was the bottleneck on M-series: GPU compute
# is sub-second but each batch took ~50 s of soundfile + ECAPA. Three
# independent knobs fix it (see `dataset.py` for details):
#   - `decode_workers`: thread pool size for parallel audio decode
#     (soundfile/torchcodec both release the GIL during C-side decode).
#   - `decode_prefetch`: how many decode jobs to pipeline ahead of the
#     consumer, so the main thread rarely blocks on `fut.result()`.
#   - `dvec_cache_dir`: where to persist speaker d-vectors across runs;
#     ECAPA-TDNN is the slowest per-batch step, and the d-vector is a
#     function of the *speaker*, not the utterance, so caching it
#     eliminates ECAPA cost after ~1000 samples (LibriSpeech has ~1172 spk).
#
# Memory-conscious defaults for 16 GB Apple Silicon (the previous 4×4
# combination OOM'd during the first batch because ECAPA's JIT-compiled
# kernels plus a deep prefetch queue blew past the jetsam threshold).
# On M2 Pro / M3 Pro with 18+ GB you can bump these back up to 4.
decode_workers: 2
decode_prefetch: 2
prefetch_batches_max: 2
dvec_cache_dir: models/dvec_cache

# ---- Reference-waveform cap (memory win on MPS) ----
# ECAPA only needs ~3-6 s of audio for a stable speaker embedding. The
# dataset caps `ref_wav` to this length so `collate_triplets` pads to at
# most `int(ref_max_sec * sample_rate)` samples instead of the longest
# utterance in the batch (some LibriSpeech speakers are ~30 s). Without
# this, a 16-element batch's `ref_wavs` tensor was 30 MB CPU/MPS each,
# multiplied by `prefetch_batches_max` queued copies. See HParams doc.
ref_max_sec: 6.0
