# Paper-faithful training configuration for VoiceFilter-Lite.
#
# Aligned with the **slides-authoritative** Interspeech 2020 deck
# (Wang et al., https://google.github.io/speaker-id/publications/
# VoiceFilter-Lite/resources/interspeech2020_voicefilterlite_slides.pdf)
# — the first author's official conference presentation. The slides are
# treated as the ground truth where they speak explicitly; everything
# else (sample rate, n_fft, hop, win, mel bin, frame_stack, log
# compression, β, training hyperparameters) is held at the upstream /
# ASR-convention default and called out in comments.
#
# Slides-explicit alignment:
#   - 3 LSTM layers × 512 nodes (slides p.28 "Models")
#   - 1D CNN before the LSTM (slides p.17 Fig. 1b)
#   - Noise-type predictor head: 2 FF × 64 nodes (slides p.28)
#   - Asymmetric L2 loss with α = 10 (slides p.32, p.36)
#   - Adaptive suppression w^(t) driven by the noise-type predictor
#     (slides p.23–25, §3.4)
#   - Training SNR drawn uniformly from 1 dB to 10 dB (slides p.29)
#   - 3-second training segments (slides Fig. 2 caption)
#   - 5 noise cases: Clean / Non-speech additive / Non-speech
#     reverberant / Speech additive / Speech reverberant (slides p.29)
#
# Caveats (slides do NOT specify; held at upstream / ASR-convention
# default and called out below):
#   - sample_rate / n_fft / hop / win / n_mels / frame_stack / log
#     compression — no slides text; using ASR-convention 16 kHz /
#     n_fft=400 / hop=160 / win=400 / 80-mel / frame_stack=4 /
#     log(x + 1e-6)
#   - β (adaptive EMA coefficient) — slides only say β ∈ [0, 1); held
#     at the open-source-convention β = 0.8
#   - Training hyperparameters (LR / batch / optimizer / steps /
#     warmup / grad-clip / weight-decay / EMA) — slides do not specify
#     any of these; held at the open-source-convention defaults
#
# RIR / reverberant cases (slides p.29 case 3 + case 5) are NOT
# implemented here — no suitable RIR dataset bundled.
#
# Loaded via:
#     python scripts/train.py --config configs/paper.yaml
#
# Any field here overrides the matching default in `HParams`.
# CLI flags (e.g. --seed 1234) still take precedence over this file.
#
# Config blocks mirror the nested `HParams`:
#   model:      audio + dvector + arch + predictor + loss + ema
#   dataset:    sources (top-level upstream HF dataset declarations) +
#               target + interference (function-oriented types) +
#               mixture + activity + reference + processed_dir
#   train:      batch_size + optimiser + scheduler + EMA cadence + I/O cadence
#
# The `dataset.sources` block declares every upstream HF dataset we
# download ONCE; `target.sources[*]` and `interference.{babble,noise,
# music}.sources[*]` reference those declarations by `id` (via
# `source: <id>`), with optional `subset:` (HF config name on MUSAN)
# and `splits:` (LibriSpeech) overrides. This avoids duplicating
# `repo` / `cache_dir` across multiple TYPEs that share the same
# upstream pool.

model:
  # ---- Audio / STFT / mel ----
  # Slides do NOT pin the exact STFT / mel / log-compression
  # parameters. Held at the upstream / ASR-convention defaults that
  # match a 16 kHz Google-on-device-ASR frontend (25 ms window,
  # 10 ms hop, 80-mel). Swap to slides-explicit numbers if/when they
  # surface in a downstream paper / official TFLite config.
  audio:
    # Target sample rate (Hz). Slides do not specify; shared with the
    # d-vector pipeline so the same 16 kHz convention applies.
    sample_rate: 16000
    # FFT window size (samples). Slides do not specify; 400 @ 16 kHz
    # = 25 ms (ASR-convention).
    n_fft: 1200
    # STFT hop (samples). Slides do not specify; 160 @ 16 kHz
    # = 10 ms (ASR-convention).
    hop_length: 160
    # Window length (samples). Slides do not specify; equal to n_fft
    # → no edge padding.
    win_length: 640
    # Mel filterbank count. Paper §4.2 fixes this at 128 for the
    # main experiment + the 2.2 MB ship-target (Table 2 last row uses
    # stacked 128-dim mel). The 513-dim FFT magnitude feature in §4.2
    # is a separate ablation row (Table 1 "FFT magnitude"), NOT the
    # ship-target — see the comparison paragraph at the end of §4.2.
    n_mels: 128
    # Floor added before log() to avoid log(0). Slides do not specify
    # the log compression; current ASR-convention is log(x + ε).
    log_mel_floor: 1.0e-6
    # Past frames concatenated with the current frame. Slides do not
    # pin frame_stack; held at the upstream convention 4
    # (128×4=512 stacked-mel input + 256-d d-vector = input_dim 768).
    frame_stack: 4

  # ---- d-vector encoder (paper §3.1, matches pretrained embedder.pt) ----
  # These fields are tied to the bundled `models/embedder.pt` weights;
  # changing them silently breaks weight loading. Kept explicit so the
  # architecture is visible in the config.
  dvector:
    # Path to the pretrained d-vector encoder state dict.
    pt_path: models/embedder.pt
    # LSTM hidden width (768 in upstream VoiceFilter / paper §3.1).
    lstm_hidden: 768
    # Number of stacked LSTM layers (paper §3.1).
    lstm_layers: 3
    # Projection dimension (paper §3.1, 256-d; fixed at D_VECTOR_DIM).
    emb_dim: 256
    # Mel filterbanks for the d-vector pipeline (40, upstream default).
    n_mels: 40
    # FFT size for the d-vector STFT (512 @ 16 kHz = 32 ms).
    n_fft: 512
    # Window length for the d-vector STFT (25 ms @ 16 kHz).
    win_length: 400
    # Hop length for the d-vector STFT (10 ms @ 16 kHz).
    hop_length: 160
    # Sliding-window width (frames) for per-window encoder forward.
    window: 80
    # Sliding-window stride (frames). 80/40 = 50% overlap.
    stride: 40

  # ---- Mask-predictor LSTM + optional 1D-CNN pre-stack ----
  # Slides p.28 explicitly fixes the VoiceFilter-Lite main architecture
  # at 3 LSTM × 512 nodes (the production ship-target after INT8
  # dynamic-range quantization + adaptive w^(t) training lands at
  # 2.2 MB per slides p.32 / p.36). The slides do NOT pin a separate
  # "small hidden" 2.2 MB variant — they simply list 3 × 512 as the
  # architecture and 2.2 MB as the post-INT8 ship size.
  arch:
    # LSTM hidden width. 512 = slides p.28 ("3 LSTM layers, each with
    # 512 nodes"). The slides do not give an explicit
    # `2.2 MB ↔ hidden=256` mapping; the conventional reading is
    # "post-INT8 2.2 MB comes from 512 hidden + adaptive w^(t)".
    hidden_dim: 512
    # Number of stacked LSTM layers. 3 = slides p.28.
    num_lstm_layers: 3
    # Dropout probability on LSTM input/output. 0.1 is a paper-style
    # default; slides do not specify.
    dropout: 0.10
    # Insert num_cnn_layers stacked Conv1d before the LSTM. The paper
    # itself admits "most of our models actually remove these CNN
    # layers and purely consist of LSTM layers" — we follow that
    # LSTM-only topology here. The 1D-CNN path (slides p.17 Fig. 1b)
    # is the explicit "1D CNN" topology; flip this on to reproduce
    # that figure at the cost of extra Conv1d kernel calls.
    use_cnn: false
    # Number of Conv1d layers when use_cnn=True. Paper Figure 2: 2.
    num_cnn_layers: 2
    # Conv1d kernel size. 3 matches paper Figure 2.
    cnn_kernel_size: 3
    # Conv1d intermediate channel count. Last layer projects to
    # hidden_dim so it feeds the LSTM directly.
    cnn_channels_first: 8

  # ---- Noise-type predictor (paper §4.2 / §3.4) ----
  # Trained with hinge loss for per-frame binary classification
  # ("is this frame overlapped speech?"). At inference, its sigmoid drives
  # the adaptive suppression `w^(t)` per §3.4 — the paper's "always
  # harmless and sometimes helpful" production behaviour.
  predictor:
    # Train the hinge-loss predictor branch (slides p.28 lists the
    # noise-type head as part of the architecture).
    use_noise_type_predictor: true
    # Slides §3.4 Eq. 5: f_adapt reads the *current frame's* noisy
    # filterbank (S_in^(t)). Slides do not pin the filterbank dim;
    # when n_mels = 128 the head input is 128-d. False = legacy
    # LSTM-hidden-state variant, kept for backward compat with
    # already-trained checkpoints.
    alpha_head_use_current_frame: true

  # ---- Loss (paper §3.3 — asymmetric L2, α = 10) ----
  # g_asym(x, α) = α·x if x > 0 else x; loss = Σ_t Σ_f g_asym(...)² (paper §3.3
  # Eq. 3 — literal sum, NOT per-element mean). Over-suppression errors
  # (S_enh < S_cln) are amplified by α² = 100. Magnitude of L_asym is now
  # ~T·F larger than the legacy mean() variant, so `noise_type_loss_weight` is
  # calibrated down to ~1/(T·F) of the old default.
  loss:
    # g_asym(x, α) = α·x if x > 0 else x. Paper §3.3 α=10 → over-
    # suppression errors amplified by α²=100.
    alpha: 10
    # α-schedule start value (step 0). With α_start=1.0 the early phase
    # of training runs a plain MSE (no over-suppression preference) so
    # the model first learns which mel-bins discriminate target vs
    # interference; the ramp below then turns on the over-suppression
    # penalty. This breaks the "always emit M≈1 to dodge α² penalty"
    # trap the paper's constant-α form is prone to: by the time α
    # climbs past 1.0 the model already has meaningful discrimination,
    # so bias drift toward pass-through gets harder.
    alpha_start: 1.0
    # Number of steps to ramp α from `alpha_start` to `alpha` (linear).
    # 0 = disable annealing (constant α end-to-end, paper-faithful).
    # 20 000 = 10% of `total_steps=200 000` — enough to settle
    # discrimination before the asymmetry kicks in, short enough that
    # the paper's intended over-suppression preference still dominates
    # the back half of training.
    alpha_ramp_steps: 20000
    # Weight on the noise-type predictor hinge loss. Paper §4.2
    # explicitly specifies hinge for the predictor's binary
    # classification. Calibrated against the Σ_t Σ_f asym term
    # (~T·F larger than legacy mean-asym); sample_length=3s, hop=10ms,
    # n_mels=128 → 1/(T·F) ≈ 3e-5.
    noise_type_loss_weight: 3.2e-4
    # Moving-average coefficient β for w^(t) update (paper §4.4 last
    # paragraph, Table 2 last row): "If we use adaptive suppression
    # strength with a moving average coefficient of 0.8, ... we observe
    # almost no WER degradation on clean and non-speech noise conditions,
    # and still a large improvement on speech noise conditions." This is
    # the value the paper reports as "always harmless and sometimes
    # helpful"
    adaptive_w_beta: 0.8
    # Linear transform slope "a > 0" applied to f_adapt (slides
    # §3.4 Eq. 5). Slides do not pin a numeric value; the
    # (a=0.7, b=0.2) pair chosen here maps f_adapt ∈ [0,1] onto
    # w_raw ∈ [0.2, 0.9]: when the predictor says clean, keep a
    # small always-on compensation (w_min=0.2) so a wrong "not-overlap"
    # call still lets some VoiceFilter benefit through; when the
    # predictor says overlap, near-full filtering (w_max=0.9) with a
    # sliver of the original input as a safety net against predictor
    # overshoot. Pairs with β=0.4 above (paper §4.4 last row). The
    # identity default a=1, b=0 is a stronger assumption on the
    # predictor and was held only because slides do not pin a numeric
    # value — adopt a=0.7, b=0.2 for the "always harmless, sometimes
    # helpful" production behaviour.
    adaptive_w_a: 0.7
    # Linear transform intercept "b ≥ 0" applied to f_adapt (slides
    # §3.4 Eq. 5). b=0.2 sets w_min; see adaptive_w_a above for the
    # full derivation (a=0.7 + b=0.2 maps [0,1] → [0.2, 0.9]).
    adaptive_w_b: 0.2

  # ---- EMA (exponential moving average of model weights) ----
  ema:
    # Enable EMA. Typically gives +0.5 dB SDR on validation; the
    # final ckpt saved by train.py uses EMA weights.
    use: true
    # Decay rate: shadow = decay · shadow + (1-decay) · model.
    # 0.999 ≈ 1000-step effective memory.
    decay: 0.999
    # Steps during which EMA is forced equal to model (no averaging).
    warmup_steps: 500

dataset:
  # ---- Upstream HF dataset declarations ----
  # Each entry is an `HfSourceSpec` (id, repo, configs, splits, cache_dir).
  # `target.sources[*]` and `interference.{babble,noise,music}.sources[*]`
  # reference these by `id` via `source: <id>` (with optional `subset:`
  # to pick one config and optional `splits:` to override the spec's
  # defaults).
  sources:
    # LibriSpeech — one spec covers both `clean` (target) and `other`
    # (interference speech). The `all` HF config exposes every
    # `train.<role>.<size>` split under one arrow cache; refs narrow
    # to a role by listing the corresponding split (`train.clean.360`
    # for target, `train.other.500` for interference).
    - id: librispeech
      repo: openslr/librispeech_asr
      configs: [all]
      splits: [train.clean.360, train.other.500]
      cache_dir: data/librispeech

    # MUSAN — declared once for all three configs. Refs narrow with
    # `subset: speech` / `subset: noise` / `subset: music` (each is
    # an HF config name on corypaik/musan).
    - id: musan
      repo: corypaik/musan
      configs: [speech, noise, music]
      cache_dir: data/musan

  # ---- Target source ----
  # A list of `SourceRef`s pointing into `dataset.sources[*]` by `id`.
  # The librispeech spec exposes one HF config (`all`); no `subset:`
  # is needed. `splits:` here overrides the spec's defaults (target
  # only needs `train.clean.360`; `train.other.500` is for evaluation
  # harnesses — `evaluate.py` / `diag_mask.py` / `examples/04_*` —
  # and is baked by `prepare_dataset` if any TYPE's `sources[*]`
  # references librispeech `other`, OR is loaded directly from HF).
  target:
    sources:
      - source: librispeech
        splits: [train.clean.360]

  # ---- Interference (function-oriented) ----
  # Each TYPE has its own INDEPENDENT inclusion probability (`prob`),
  # sources, and synthesis rule. Per sample the dataset rolls each TYPE's
  # prob independently (Bernoulli) and SUMS the included components into
  # one interference waveform — so a single sample may carry only noise,
  # only music, noise+music, babble+noise, babble+music, all three, or
  # none. The three probs do NOT sum to 1 (they're independent).
  #
  # Built-in types:
  #   babble : runtime overlay of N ∈ [n_speakers_min,
  #            n_speakers_max] DISTINCT speakers drawn from the babble
  #            pool (the union of every `babble.sources[*]` resolved
  #            by the dataset — by default musan `speech` only; the
  #            picker dedups by speaker identity, so musan clips and
  #            librispeech(other) spk_ids coexist cleanly). To include
  #            librispeech `other` in babble, add it under
  #            `babble.sources`; for "bakable but not babble-eligible"
  #            (the default for paper.yaml), keep it under another
  #            TYPE's `sources[*]` so `prepare_dataset` still bakes
  #            the pool and `first_librispeech_other_source` can find
  #            it for evaluation / audition harnesses.
  #   noise  : passthrough of one MUSAN `noise` clip. Additional refs
  #            under `noise.sources` (e.g. librispeech `other`) are
  #            baked but NOT consumed by the runtime noise mixer.
  #   music  : passthrough of one MUSAN `music` clip.
  # Mixing happens at TRAINING time — `prepare_dataset` only decodes
  # the upstream pools under `pool/<spec.id>/<role-or-subset>/...` and
  # the dataset iterator mixes them per sample. Disabling a TYPE
  # (prob=0 or enabled=false) excludes it from runtime sampling.
  interference:
    babble:
      enabled: true
      prob: 0.8 # independent Bernoulli prob of inclusion per sample
      sources:
        # Runtime babble source — every ref here IS consumed at training
        # time. To restrict babble to musan speech only, leave this list
        # as-is (the librispeech `other` ref has been moved to
        # `noise.sources` below so it stays baked + discoverable for eval
        # but is NOT mixed into runtime babble).
        - source: musan
          subset: speech
      n_speakers_min: 1
      n_speakers_max: 3
      babble_seg_min_sec: 1
      babble_seg_max_sec: 4.0
      gain_min: 0.6
      gain_max: 1.2
    noise:
      enabled: true
      prob: 0.5 # independent Bernoulli prob of inclusion per sample
      sources:
        # Runtime noise = musan `noise` passthrough. The librispeech
        # `other` ref below is baked by `prepare_dataset` and is
        # discoverable via `first_librispeech_other_source` for
        # evaluation / audition harnesses, but the runtime noise mixer
        # only consumes `pool/musan/noise/`.
        - source: musan
          subset: noise
        - source: librispeech
          splits: [train.other.500]
    music:
      enabled: true
      prob: 0.5 # independent Bernoulli prob of inclusion per sample
      sources:
        - source: musan
          subset: music

  # ---- Mixture / SNR / silence ----
  mixture:
    # Training segment length (s). Paper Fig 2: 3.0 s. We use 2.0 s
    # locally — at 16 kHz with n_fft=1200 / hop=160 the LSTM sees
    # T=201 frames instead of T=293, a ~30% per-step saving on
    # Apple's sequential LSTM kernel without changing the streaming
    # mask-prediction task materially. Bump to 3.0 for the
    # paper-faithful run.
    sample_length_sec: 4.0
    # Lower bound on training SNR (dB). Paper §3.2: 1 dB.
    snr_min_db: 1.0
    # Upper bound on training SNR (dB). Paper §3.2: 10 dB.
    snr_max_db: 10.0
    # Probability that the target wav is replaced by silence.
    # Trains the "do nothing" pass-through mode.
    silent_target_prob: 0.10
    # Probability that the interference wav is replaced by silence.
    silent_interference_prob: 0.10

  # ---- Per-frame activity bursts (paper §4.2 / deviation 5) ----
  # The noise-type predictor's per-frame label is +1 where BOTH target
  # and interference burst windows cover the frame centre, -1 elsewhere.
  # Bursts are drawn uniformly within [burst_min, burst_max] seconds and
  # gated by a soft 0/1 mask with `activity_fade_ms` fade in/out
  # (avoids click artefacts).
  activity:
    # Lower bound on burst duration (s).
    burst_min_sec: 0.5
    # Upper bound on burst duration (s).
    burst_max_sec: 4.0
    # Fade-in / fade-out length (ms) at burst edges.
    fade_ms: 50.0

  # ---- Reference (d-vector source utterance) ----
  reference:
    # Maximum reference-wav length (s). Caps the d-vector pipeline at
    # ref_max_sec × sample_rate samples, so collate_triplets pads to
    # a bounded max instead of the longest batch utterance (some
    # LibriSpeech speakers are ~30 s — caps prevent OOM).
    max_sec: 6.0

  # ---- Local-dataset output (output of `scripts/prepare_dataset.py`) ----
  # The baked wav / npy / manifest.json tree. Per-source HF arrow caches
  # live on each source spec (`cache_dir`), not here.
  processed_dir: data/processed

  # ---- Background-prefetch depth ----
  # PrefetchIterator queue depth on the main thread. 4 keeps the GPU
  # fed even when one worker is blocked on a slow `sf.read()` decode
  # (musan music in particular has long clips + cold mmap). Each
  # queued batch costs `B × T × n_mels × frame_stack × 4 B ≈ 19 MB` on
  # CPU; 4 × 19 MB ≈ 76 MB is well under the M-series unified-memory
  # budget after the d-vector cache + target index reservations.
  prefetch_batches_max: 4

train:
  # ---- Optimisation ----
  # Mini-batch size. Paper-faithful 32 for CUDA; halve on MPS.
  batch_size: 32
  # Total optimisation steps. Paper: 200 000.
  total_steps: 200000
  # AdamW learning rate. Paper convention at batch=32 was 2e-3 with
  # Adam on the per-element-mean asymmetric L2; the sum-form
  # Σ_t Σ_f g_asym² (`losses.py::asymmetric_l2_loss`) is ~T·F ≈ 38 000×
  # larger, so the LR is dropped ~40× to keep the per-element update
  # step in the same band as the original convention. Sweep
  # 1e-5 … 5e-4 with an LR-range-test if you change `n_mels`,
  # `sample_length_sec`, or the loss reduction.
  learning_rate: 5.0e-5
  # AdamW weight_decay (decoupled L2 — applied directly to θ, not into
  # the gradient). Magnitude is independent of the adaptive step size,
  # so the legacy Adam+L2 value of 1e-5 was effectively zero; AdamW
  # needs values in the 1e-4 … 1e-2 range to act as real regularisation.
  # 1e-2 is a safe default for a 6.7 M-param LSTM — lower it to 1e-4 if
  # you observe validation loss rising while training loss keeps falling.
  weight_decay: 1.0e-2
  # Linear warmup duration before cosine decay starts.
  warmup_steps: 3000
  # Max global gradient norm (clip_grad_norm_).
  grad_clip_norm: 2.0
  # Print training heartbeat every N steps.
  log_every: 5
  # Save a checkpoint every N steps. Last 3 ckpts are kept.
  ckpt_every: 1000
  # Call torch.{mps,cuda}.empty_cache() every N steps (0 = disabled).
  # Default 5000 (was 2000): MPS empty_cache is a ~20–50ms stall — the
  # deeper hollow-cache histories in the GPU monitor line up with these
  # calls. Halving the cadence gains nothing because high-water-mark
  # memory only climbs with new tensor shapes, not with more steps;
  # 5000 is plenty on a 16 GB unified-memory M-series chip. Set to 0
  # to disable entirely (rely on the OS to reclaim).
  empty_cache_every: 50000

  # ---- Misc ----
  # PRNG seed for dataset / model init / training.
  seed: 1234
  # Number of background DataLoader worker processes. Each runs its
  # own dataset instance (its own scan of `data/processed/`, its own
  # RNG seeded by worker_id), collates batches on CPU, and pushes onto
  # a shared queue. 4 = paper-friendly; on Apple Silicon MPS the main
  # thread is GIL-bound on dataset-item prep, so 4 workers + a deeper
  # `prefetch_batches_max` covers the GPU without the GIL contention
  # that 6 workers caused.
  dataloader_workers: 8

# ---- HF Hub endpoint (network mirror) ----
# Default behaviour: every HF pull during `prepare_dataset.py` goes to
# `https://huggingface.co`. If your network can't reach that host (common
# in mainland China without a VPN), point `hf_endpoint` at a mirror so
# all HF traffic is redirected. Precedence is
# `--hf-endpoint` (CLI) > `HF_ENDPOINT` env > this field > default.
# Equivalent env: `HF_ENDPOINT=https://hf-mirror.com python ...`
# Uncomment the line below to make this config self-contained:
# hf_endpoint: https://hf-mirror.com

# ---- HF hf_transfer protocol toggle ----
# `huggingface_hub` has a faster download protocol (`hf_transfer`) that's
# opt-in via `HF_HUB_ENABLE_HF_TRANSFER`. Most mirrors DON'T implement
# it and will silently 502. Default `null` lets `apply_hf_endpoint`
# auto-disable it on a mirror; force-on/off via `--hf-transfer` /
# `--no-hf-transfer`, or here:
# hf_transfer: false   # uncomment to force HTTPS-only (safe on mirrors)
