[project]
name = "cli"
version = "0.1.0"
description = "VoiceFilter-Lite training / data-prep / ONNX export CLI (workspace-only)"
authors = [{ name = "linsan", email = "bin.zaq@foxmail.com" }]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Not published: this package is for in-repo use; the public surface is
# `pip install open-voicefilter-lite` (the lib) plus the scripts under
# `main.py` at the repo root.

dependencies = [
    "open-voicefilter-lite",
    # CLI plumbing — typed subcommand dispatch.
    "cyclopts>=5.0",
    # Data
    "datasets>=2.20",
    "huggingface_hub>=0.23",
    # Speaker embedding (SpeechEmbedder pre-trained weights come from upstream
    # `voicefilter`, which uses speechbrain's pyphonem / hf model id helper).
    "speechbrain>=1.0",
    # Logging
    "tensorboard>=2.16",
    # Export / evaluation
    "onnx>=1.16",
    "onnxscript>=0.2",
    "onnxruntime>=1.17",
    # Audio decode (HF datasets can return AudioDecoder on torchcodec)
    "torchcodec>=0.16.0",
    "librosa>=0.11.0",
]

[project.scripts]
voicefilter-cli = "voicefilter_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicefilter_cli"]