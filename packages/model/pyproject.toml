[project]
name = "model"
version = "0.0.0"
description = "VoiceFilter-Lite training library (workspace-only, NOT published)"
authors = [{ name = "linsan", email = "bin.zaq@foxmail.com" }]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# NOT published to PyPI. This package is for in-repo use by the
# training CLI (`packages/cli/`). External users get the inference
# half via `pip install open-voicefilter-lite` — that wheel ships the
# pretrained ONNX + StreamingVoiceFilter only, with no torch
# dependency. This package is the training counterpart that the CLI
# sits on top of.
dependencies = [
    # Public inference package (for HParams, ONNX metadata parsing,
    # YAML config loader). Re-exported under the `voicefilter_lite`
    # Python name on the importer's path; `model` doesn't re-export it.
    "open-voicefilter-lite",
    # Training itself — torch + torchaudio + librosa for fbank / STFT.
    "torch>=2.2",
    "torchaudio>=2.2",
    "numpy>=1.26",
    "librosa>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model"]
