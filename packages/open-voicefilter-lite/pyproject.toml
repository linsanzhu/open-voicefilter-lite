[project]
name = "open-voicefilter-lite"
version = "0.1.1"
description = "Streaming targeted voice separation (VoiceFilter-Lite reimplementation) — turnkey PCM-in/PCM-out API with bundled ONNX models"
readme = "README.md"
authors = [{ name = "linsan", email = "bin.zaq@foxmail.com" }]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # Core
    "torch>=2.2",
    "torchaudio>=2.2",
    "numpy>=1.26",
    # Audio IO + DSP
    "soundfile>=0.12",
    # ONNX inference (turnkey bundled-model path)
    "onnxruntime>=1.17",
    "onnx>=1.16",
    "librosa>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicefilter_lite"]

# Bundle the shipped ONNX models into the wheel so `import voicefilter_lite`
# works without any model files on disk. Both files live under
# `src/voicefilter_lite/models/` in the source tree (added so the wheel
# ships them at `voicefilter_lite/models/<name>.onnx` next to
# `voicefilter_lite/__init__.py`). Resolved at runtime via
# `importlib.resources.files("voicefilter_lite").joinpath("models", ...)`.
[tool.hatch.build.targets.wheel.force-include]
"src/voicefilter_lite/models/voicefilter_lite.int8.onnx" = "voicefilter_lite/models/voicefilter_lite.int8.onnx"
"src/voicefilter_lite/models/embedder.int8.onnx" = "voicefilter_lite/models/embedder.int8.onnx"
