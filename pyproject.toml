# Workspace root for open-voicefilter-lite.
#
# Two uv-managed packages live side-by-side:
#   * `packages/open-voicefilter-lite/`  — PyPI-published lib
#                                         (model + audio + streaming)
#   * `packages/cli/`                   — repo-only CLI (training /
#                                         data prep / ONNX export)
#
# Install everything into the workspace venv with `uv sync` from the
# repo root.  External users (lib only) just `pip install open-voicefilter-lite`.
#
# The root has no `[project]` so it doesn't try to build a wheel itself —
# uv treats it as a workspace aggregator.

[tool.uv]
workspace = { members = ["packages/*"] }

[tool.uv.sources]
open-voicefilter-lite = { workspace = true }
cli = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"