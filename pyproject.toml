[project]
name = "open-voicefilter-lite"
version = "0.1.0"
description = "Streaming targeted voice separation for real-time communication (reimplementation of VoiceFilter-Lite)"
readme = "README.md"
authors = [{ name = "linsan", email = "bin.zaq@foxmail.com" }]
requires-python = ">=3.11"

dependencies = [
    # Core
    "torch>=2.2",
    "torchaudio>=2.2",
    "numpy>=1.26",
    # Audio IO + DSP
    "soundfile>=0.12",
    "scipy>=1.11",
    # Data
    "datasets>=2.20",
    "huggingface_hub>=0.23",
    # Speaker embedding
    "speechbrain>=1.0",
    # Logging
    "tensorboard>=2.16",
    # Export / evaluation
    "onnx>=1.16",
    "onnxscript>=0.2", # transitive dep of torch.onnx; pin to avoid surprises
    "onnxruntime>=1.17",
    # CLI / config
    "pyyaml>=6.0",
    "torchcodec>=0.16.0",
    "librosa>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
open-voicefilter-lite = "open_voicefilter_lite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_voicefilter_lite"]

[tool.ruff]
line-length = 100
target-version = "py311"
